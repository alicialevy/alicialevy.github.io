<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="database/style.css">
    <script src="sorttable.js"></script>
<style>
    .wrapper {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 10px;
  grid-auto-rows: minmax(100px, auto);
}

.left{
    grid-column: 1 / 3;
}

.right{
    grid-column: 3;
    
}

.iframe-link iframe {
    display: none;
}
.iframe-link:hover iframe {
    display: block;
}
  
    body{
  width: 100%;
  height: 100%;
    }

    .titre{
        font-size: large;
    }
    
    table{
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        table-layout: auto;
        vertical-align: top;
    }


    

    .film-name{
        width: 20%;
        font-weight: bold;
    }
    

    .tags{
        width: 20%;
    }


    tr:hover{
        background-color: burlywood;
    }
    
    th, td {
    border-bottom: 1px dotted #233d29;
    padding-top: 0px;
    padding-right: 0px;
    padding-bottom: 0px;
    padding-left: 0px;
    text-align: left;
}

table.sortable th::after, th.sorttable_sorted::after, th.sorttable_sorted_reverse::after {
  content: " ";
  display: inline-block;
  width: 8px;
  height: 8px;
}

iframe {
    width: 100%;
    height: 100%;
}

th.sorttable_sorted::after {
  background: url(arrow-down.png);
  background-size: contain;
}
th.sorttable_sorted_reverse::after {
  background: url(arrow-up.png);
  background-size: cover;
}
#sorttable_sortfwdind, #sorttable_sortrevind { display: none; } 

table.sortable th:not(.sorttable_sorted):not(.sorttable_sorted_reverse):not(.sorttable_nosort):after { 
    content: ">" 
}

.navbar {
  padding: 8px;
  padding-bottom: 20px;
  border-bottom: dotted 1px;
 
}

.page {
    padding-right: 25px;
    padding-left: 25px;
    padding-top: 5px;
    padding-bottom: 5px;
     background-color: rgba(222, 184, 135, 0.23);
    font-weight: bold;
    color: rgb(196, 139, 66);
    border:1px dotted burlywood;
}

.posecle {
  font-size: large;
  padding-right: 10px;
    padding-left: 10px;
    padding-top: 5px;
    padding-bottom: 5px;
}



.page:hover {
  background-color: rgba(222, 184, 135, 0.59);
}

</style>
</head>

</div>
