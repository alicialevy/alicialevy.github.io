<script>


//DYNAMIC IFRAME//

function renderiframeonhover(){
const trigger = document.querySelectorAll('.trigger');

trigger.forEach(trigger => {
    
  
    trigger.addEventListener('mouseenter', () => {
        const iframeDocument = document.querySelector("iframe").contentDocument;
        let display = iframeDocument.getElementById("displaydata");
        let html = "";
      
        const filmname = trigger.querySelector(".filmname").innerHTML;
        const filmdirector = trigger.querySelector(".director").innerHTML;
        const filmimg = trigger.dataset.img || '';
        const filmlinksource = trigger.dataset.linksource || '';
        const filmlink = trigger.querySelector(".filmnamelink").href;
        const filmsynopsis = trigger.dataset.synopsis || '';

        html += '<div class="image">';
        html += '<img src=\"' + filmimg + '\">';
        html += '</div>';
        html += '<div class=\"film-name\">';
        html += '<p>' + filmname + ' · <span class=\"film-director\">' + filmdirector +'</span></p>';
        html += '</div>' ;
        html += '<div class=\"button-line\">';
        html += '<a href=\"' + filmlink + '\" target=\"_blank\"><button class=\"link\">watch on ' + filmlinksource + '</button></a>';
        html += '</div>';
        html += '<div class="synopsis">';
        html += '<p><b>synospis :</b></p>';
        html += '<p>' + filmsynopsis + '</p>';
        html += '</div>';




        display.innerHTML = html;
    });

});
}




//SEARCH TAG//

function searchtag() {

  var input, filter, ul, li, a, i, txtValue;
  input = document.getElementById('taginput');
  filter = input.value.toUpperCase();
  ul = document.getElementById("taglist");
  li = ul.getElementsByTagName('li');

  for (i = 0; i < li.length; i++) {
    a = li[i].getElementsByTagName("a")[0];
    txtValue = a.textContent || a.innerText;
    if (txtValue.toUpperCase().indexOf(filter) > -1) {
      li[i].style.display = "";
    } else {
      li[i].style.display = "none";
    }
  }
}

//TAG SYSTEM//

function acc(trigger) {
trigger.closest('.acc-item').classList.toggle('open');
}

function filter2(tag, btn) {
document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
document.querySelectorAll('.entry').forEach(entry => {
const tags = entry.dataset.tags || '';
entry.classList.toggle('hidden', tag !== 'all' && !tags.split(' ').includes(tag));
});
}

function filtercountry(country, btn) {
document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
document.querySelectorAll('.entry').forEach(entry => {
const countries = entry.dataset.country || '';
entry.classList.toggle('hidden', country !== 'all' && !countries.split(' ').includes(country));
});
}

function filterdirector(director, btn) {
document.querySelectorAll('.director-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
document.querySelectorAll('.entry').forEach(entry => {
const directors = entry.dataset.director || '';
entry.classList.toggle('hidden', director !== 'all' && !directors.split(' ').includes(director));
});
}

/* -------------------------------
   EXPANDABLE ENTRIES from lowverve : lowverve.neocities.org
-------------------------------- */
document.querySelectorAll(".expand").forEach(button => {
    button.addEventListener("click", () => {
        const text = button.nextElementSibling;
        if (!text) return;

        text.classList.toggle("active");
        button.textContent = text.classList.contains("active")
            ? "filter v"
            : "filter >" ; 
    });
})

document.querySelectorAll(".expand-schools").forEach(button => {
    button.addEventListener("click", () => {
        const text = button.nextElementSibling;
        if (!text) return;

        text.classList.toggle("active");
        button.textContent = text.classList.contains("active")
            ?"student-film v"
            :"student-film >" ; 
    });
})



  



</script>
