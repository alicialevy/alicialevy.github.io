<script>

function searchtag() {

  var input, filter, ul, li, a, i, txtValue;
  input = document.getElementById('taginput');
  filter = input.value.toUpperCase();
  ul = document.getElementById("taglist");
  li = ul.getElementsByTagName('li');

  for (i = 0; i < li.length; i++) {
    a = li[i].getElementsByTagName("a")[0];
    txtValue = a.textContent || a.innerText;
    if (txtValue.toUpperCase().indexOf(filter) > -1) {
      li[i].style.display = "";
    } else {
      li[i].style.display = "none";
    }
  }
}

function acc(trigger) {
trigger.closest('.acc-item').classList.toggle('open');
}

function filter2(tag, btn) {
document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
document.querySelectorAll('.entry').forEach(entry => {
const tags = entry.dataset.tags || '';
entry.classList.toggle('hidden', tag !== 'all' && !tags.split(' ').includes(tag));
});
}

/* -------------------------------
   EXPANDABLE ENTRIES from lowverve : lowverve.neocities.org
-------------------------------- */
document.querySelectorAll(".expand").forEach(button => {
    button.addEventListener("click", () => {
        const text = button.nextElementSibling;
        if (!text) return;

        text.classList.toggle("active");
        button.textContent = text.classList.contains("active")
            ? "filter v"
            : "filter >" ; 
    });
});



</script>
